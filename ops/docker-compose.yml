services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - rppc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
volumes:
  rppc_pg:
